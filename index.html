<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diana Caragea — Psychoanalysis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: #efe9df;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      color: #2d332c;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 3 / 2;
      background: url("./background.png") center / cover no-repeat;
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(45, 38, 28, 0.18);
      container-type: inline-size;
    }

    .page p {
      position: absolute;
      left: 30.5%;
      transform: translateX(-50%);
      margin: 0;
      text-align: center;
    }

    .eyebrow {
      top: 22%;
      left: 29%;
      font-family: "Cinzel", serif;
      letter-spacing: 0.55em;
      font-size: 1.15cqw;
      color: #2d332c;
      text-indent: 0.55em;
      white-space: nowrap;
    }

    .subtitle {
      top: 27%;
      font-family: "Cinzel", serif;
      letter-spacing: 0.4em;
      font-size: 0.8cqw;
      color: #6c665d;
      text-transform: uppercase;
      text-indent: 0.4em;
      white-space: nowrap;
    }

    .headline {
      top: 33%;
      font-family: "Cinzel", serif;
      font-weight: 500;
      font-size: 3.4cqw;
      line-height: 1.05;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      width: 44%;
      color: #2d332c;
    }

    .lead {
      top: 61%;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.5cqw;
      color: #2d332c;
      white-space: nowrap;
    }

    .name {
      top: 64%;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 4.4cqw;
      letter-spacing: 0.01em;
      color: #8a6f50;
      line-height: 1;
      white-space: nowrap;
    }

    .here {
      top: 72%;
      font-family: "Pinyon Script", "Brush Script MT", cursive;
      font-size: 2.6cqw;
      color: #2d332c;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2cqw;
      width: 22%;
    }

    .here::before,
    .here::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #b89d77;
    }

    .quote {
      top: 86%;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.3cqw;
      line-height: 1.45;
      color: #49463f;
      width: 30%;
    }

    .quote-author {
      top: 95%;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 0.9cqw;
      color: #8a6f50;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .page {
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(45, 38, 28, 0.15);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <p class="eyebrow">PSYCHOANALYSIS</p>
    <p class="subtitle">Listen · Understand · Transform</p>
    <p class="headline">Website is Under<br />Construction</p>
    <p class="lead">Soon you will be able to reach</p>
    <p class="name">Diana Caragea</p>
    <p class="here">here</p>
    <p class="quote">“The meeting of two personalities is like the contact of two chemical substances: if there is any reaction, both are transformed.”</p>
    <p class="quote-author">—r Carl Gustav Jung</p>
  </main>
</body>
</html>
